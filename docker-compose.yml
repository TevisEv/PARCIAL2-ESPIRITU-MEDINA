version: "3.9"

services:
  task-web:
    build: .
    container_name: task-web
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "3200:3200"
    depends_on:
      - task-db
    environment:
      NODE_ENV: development
      PORT: 3200

      # DB
      POSTGRES_HOST: task-db
      POSTGRES_USER: tevis
      POSTGRES_PASSWORD: tevis123!
      POSTGRES_DB: fiis_development
      POSTGRES_PORT: 5432

      # JWT
      JWT_SECRET: super-secret-demo
      JWT_EXPIRES_IN: 15m

    networks:
      - tasks-net
    tty: true
    stdin_open: true
    command: ["npm", "run", "dev"]

  task-db:
    image: postgres:15
    container_name: task-db
    environment:
      POSTGRES_USER: tevis
      POSTGRES_PASSWORD: tevis123!
      POSTGRES_DB: fiis_development
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

      # ESTE ES EL CAMBIO IMPORTANTE 
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

    networks:
      - tasks-net

volumes:
  pgdata:
  node_modules:

networks:
  tasks-net:
    driver: bridge
