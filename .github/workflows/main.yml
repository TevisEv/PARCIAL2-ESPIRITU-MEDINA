name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ==========================================
  # TRABAJO 1: PRUEBAS AUTOMÁTICAS
  # ==========================================
  test:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./task-api

    steps:
      - name: Obtener código
        uses: actions/checkout@v3

      - name: Instalar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install

      - name: Ejecutar Pruebas (Jest)
        run: npm test

  # ==========================================
  # TRABAJO 2: DESPLIEGUE (Solo si pasan tests)
  # ==========================================
  deploy:
    needs: test # ESTE PASO ES CLAVE: Espera a que 'test' termine bien
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' # Solo desplegar si es rama main

    steps:
      - name: Obtener código
        uses: actions/checkout@v3

      - name: Login en Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Construir y Subir Imagen Docker
        uses: docker/build-push-action@v4
        with:
          context: ./task-api
          push: true
          tags: tevises/task-web:latest